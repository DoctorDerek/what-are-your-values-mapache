name: ESLint, Vitest, and XState Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: DoctorDerek/DoctorDerekCICD/.github/workflows/eslint-vitest-xstate.yml@93e29ba0fcf1d35d8ff0040002816c36d763d966
    with:
      typecheck-command: pnpm --filter @game/web exec next typegen && pnpm exec tsc -p apps/web/tsconfig.json --noEmit --incremental false && pnpm exec tsc -p apps/mobile/tsconfig.json --noEmit --incremental false && pnpm exec tsc -p packages/data/tsconfig.json --noEmit --incremental false && pnpm exec tsc -p packages/machines/tsconfig.json --noEmit --incremental false && pnpm exec tsc -p packages/utils/tsconfig.json --noEmit --incremental false
      vitest-command: pnpm exec vitest run --coverage --coverage.reportOnFailure
      coverage-files: coverage/lcov.info
      coverage-artifact-paths: coverage/
      native-command: pnpm --filter @game/mobile test:coverage
      native-coverage-files: coverage/native/lcov.info
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
